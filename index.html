<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Privilegios e Información - Iglesia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #ccc; }
      .table-scroll-container { max-height: none !important; overflow: visible !important; }
    }
    /* Estilo para celdas editables */
    [contenteditable="true"]:focus {
      outline: 2px solid #3b82f6;
      background-color: #eff6ff;
      border-radius: 0.25rem;
    }

    /* CONTENEDOR CON SCROLL DOBLE (VERTICAL Y HORIZONTAL) */
    .table-scroll-container {
      max-height: 520px;
      overflow: auto;
      position: relative;
    }

    /* 1. CABECERA FIJA VERTICALMENTE */
    .table-scroll-container thead th {
      position: sticky;
      top: 0;
      z-index: 25;
      background-color: #1e1b4b; /* bg-indigo-950 */
    }

    /* 2. PRIMERA COLUMNA FIJA HORIZONTALMENTE */
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 15;
    }

    /* 3. CRUCE SUPERIOR IZQUIERDO */
    .table-scroll-container thead th.sticky-col {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 35;
      background-color: #1e1b4b;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-12">

  <!-- Encabezado / Navbar -->
  <header class="bg-indigo-900 text-white shadow-md no-print sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-church text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Agenda de Privilegios</h1>
          <p class="text-xs text-indigo-200">Programación de Servicios y Notas</p>
        </div>
      </div>
      
      <!-- Controles principales -->
      <div class="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
        <!-- Selector de Mes/Año -->
        <div class="flex items-center bg-indigo-800 rounded-lg p-1 border border-indigo-700">
          <button id="btn-prev" class="px-3 py-1.5 hover:bg-indigo-700 rounded text-indigo-200 hover:text-white transition">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="label-mes-ano" class="px-3 py-1 text-sm font-semibold min-w-[130px] text-center capitalize">
            --
          </span>
          <button id="btn-next" class="px-3 py-1.5 hover:bg-indigo-700 rounded text-indigo-200 hover:text-white transition">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <!-- Botón Exportar WhatsApp -->
        <button id="btn-copy" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-2 transition shadow-sm active:scale-95">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span class="hidden sm:inline">Copiar WhatsApp</span>
        </button>

        <!-- Botón Imprimir -->
        <button onclick="window.print()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-2 transition shadow-sm active:scale-95">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Imprimir / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-2 sm:px-4 mt-4 sm:mt-6 space-y-6">

    <!-- Barra informativa / Vista Móvil -->
    <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-200">
      <div class="text-xs sm:text-sm text-slate-500 flex items-center gap-1.5">
        <i class="fa-solid fa-circle-info text-indigo-600"></i>
        <span>Los cambios se guardan de forma automática.</span>
      </div>
      <!-- Selector de Vista (Solo Visible en Pantallas Pequeñas) -->
      <div class="flex md:hidden bg-slate-100 p-1 rounded-lg border border-slate-200">
        <button id="btn-view-cards" class="px-2.5 py-1 text-xs font-semibold rounded-md transition bg-white text-indigo-900 shadow-sm">
          <i class="fa-solid fa-grip-vertical mr-1"></i>Tarjetas
        </button>
        <button id="btn-view-table" class="px-2.5 py-1 text-xs font-semibold rounded-md transition text-slate-600">
          <i class="fa-solid fa-table mr-1"></i>Tabla
        </button>
      </div>
    </div>

    <!-- SECCIÓN 1: CRONOGRAMA DE PRIVILEGIOS -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <h2 class="font-bold text-slate-800 flex items-center gap-2 text-base sm:text-lg">
          <i class="fa-regular fa-calendar-check text-indigo-600"></i>
          Cronograma del Mes
        </h2>
        
        <!-- Botón para Agregar Categoría -->
        <div class="flex items-center gap-2 no-print w-full sm:w-auto justify-end">
          <button id="btn-add-col" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-plus"></i> Añadir Categoría
          </button>
          <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-full hidden md:inline-block">
            Miércoles, Sábados y Domingos
          </span>
        </div>
      </div>

      <!-- VISTA EN TABLA -->
      <div id="container-table" class="table-scroll-container">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead>
            <tr id="table-head-row" class="bg-indigo-900 text-white text-xs uppercase tracking-wider">
              <th class="p-3 w-48 border-r border-indigo-800 sticky-col">Fecha / Día</th>
              <!-- Las columnas de categorías se generan aquí dinámicamente -->
            </tr>
          </thead>
          <tbody id="tbody-privilegios" class="divide-y divide-slate-200 text-sm">
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>

      <!-- VISTA EN TARJETAS (Móvil) -->
      <div id="container-cards" class="hidden md:hidden p-3 space-y-3 bg-slate-50">
        <!-- Tarjetas generadas dinámicamente -->
      </div>
    </section>

    <!-- SECCIÓN 2: APARTADO DE NOTAS MÚLTIPLES -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-bold text-slate-800 flex items-center gap-2 text-base sm:text-lg">
          <i class="fa-regular fa-note-sticky text-indigo-600"></i>
          Notas y Avisos del Mes
        </h2>
      </div>

      <div class="p-4 space-y-4">
        <!-- Formulario para agregar nueva nota -->
        <form id="form-add-nota" class="bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 space-y-3 no-print">
          <h3 class="text-xs font-bold text-slate-600 uppercase tracking-wide">Agregar Nueva Nota o Aviso</h3>
          <div class="grid grid-cols-1 gap-2.5">
            <input 
              type="text" 
              id="input-nota-titulo" 
              placeholder="Título de la nota (ej: Ensayos de Alabanza, Limpieza del Templo)..." 
              required 
              class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            >
            <textarea 
              id="input-nota-texto" 
              rows="2" 
              placeholder="Escribe el contenido detallado de la nota..." 
              required 
              class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"
            ></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm active:scale-95">
              <i class="fa-solid fa-plus"></i> Guardar Nota
            </button>
          </div>
        </form>

        <!-- Lista Dinámica de Notas Creadas -->
        <div id="lista-notas-container" class="space-y-3">
          <!-- Las notas se cargan aquí -->
        </div>
      </div>
    </section>

  </main>

  <!-- Lógica en JavaScript -->
  <script>
    let fechaActual = new Date();
    let modoVista = 'cards';

    // Categorías predeterminadas por defecto si no hay guardadas
    const categoriasDefault = [
      { id: 'diaconado', nombre: 'Diaconado', porDefecto: true },
      { id: 'alabanza', nombre: 'Alabanza', porDefecto: true },
      { id: 'predica', nombre: 'Prédica', porDefecto: true },
      { id: 'multimedia', nombre: 'Multimedia', porDefecto: true }
    ];

    // Elementos DOM
    const labelMesAno = document.getElementById('label-mes-ano');
    const tableHeadRow = document.getElementById('table-head-row');
    const tbodyPrivilegios = document.getElementById('tbody-privilegios');
    const containerCards = document.getElementById('container-cards');
    const containerTable = document.getElementById('container-table');
    const formAddNota = document.getElementById('form-add-nota');
    const inputNotaTitulo = document.getElementById('input-nota-titulo');
    const inputNotaTexto = document.getElementById('input-nota-texto');
    const listaNotasContainer = document.getElementById('lista-notas-container');
    const btnAddCol = document.getElementById('btn-add-col');
    const btnCopy = document.getElementById('btn-copy');
    const btnViewCards = document.getElementById('btn-view-cards');
    const btnViewTable = document.getElementById('btn-view-table');

    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    document.addEventListener('DOMContentLoaded', () => {
      renderizarTodo();

      document.getElementById('btn-prev').addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() - 1);
        renderizarTodo();
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() + 1);
        renderizarTodo();
      });

      btnViewCards.addEventListener('click', () => cambiarVistaMovil('cards'));
      btnViewTable.addEventListener('click', () => cambiarVistaMovil('table'));
      btnAddCol.addEventListener('click', agregarNuevaCategoria);

      formAddNota.addEventListener('submit', (e) => {
        e.preventDefault();
        agregarNotaMultiple();
      });

      btnCopy.addEventListener('click', copiarParaWhatsApp);
    });

    function cambiarVistaMovil(vista) {
      modoVista = vista;
      if (vista === 'cards') {
        containerCards.classList.remove('hidden');
        containerTable.classList.add('hidden');
        btnViewCards.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewCards.classList.remove('text-slate-600');
        btnViewTable.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewTable.classList.add('text-slate-600');
      } else {
        containerCards.classList.add('hidden');
        containerTable.classList.remove('hidden');
        btnViewTable.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewTable.classList.remove('text-slate-600');
        btnViewCards.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewCards.classList.add('text-slate-600');
      }
    }

    // Obtener categorías guardadas o usar las predeterminadas
    function obtenerCategorias() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyCats = `categorias_${year}_${month}`;
      return JSON.parse(localStorage.getItem(keyCats)) || [...categoriasDefault];
    }

    function guardarCategorias(categorias) {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyCats = `categorias_${year}_${month}`;
      localStorage.setItem(keyCats, JSON.stringify(categorias));
    }

    function agregarNuevaCategoria() {
      const nombreCat = prompt("Ingresa el nombre de la nueva categoría (ej: Ujieres, Jóvenes, Danza):");
      if (!nombreCat || nombreCat.trim() === "") return;

      const idCat = 'cat_' + Date.now();
      const categorias = obtenerCategorias();
      categorias.push({ id: idCat, nombre: nombreCat.trim(), porDefecto: false });
      guardarCategorias(categorias);
      renderizarTodo();
    }

    function eliminarCategoria(idCat) {
      if (!confirm("¿Estás seguro de eliminar esta categoría y todos sus datos en este mes?")) return;
      let categorias = obtenerCategorias();
      categorias = categorias.filter(c => c.id !== idCat);
      guardarCategorias(categorias);
      renderizarTodo();
    }

    function renderizarTodo() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();

      labelMesAno.textContent = `${meses[month]} ${year}`;
      const fechas = obtenerFechasEspeciales(year, month);
      const categorias = obtenerCategorias();
      const keyStorage = `privilegios_${year}_${month}`;
      const datosGuardados = JSON.parse(localStorage.getItem(keyStorage)) || {};

      // 1. Renderizar Cabecera de la Tabla
      tableHeadRow.innerHTML = `<th class="p-3 w-48 border-r border-indigo-800 sticky-col">Fecha / Día</th>`;
      categorias.forEach(cat => {
        const th = document.createElement('th');
        th.className = 'p-3 border-r border-indigo-800 relative group';
        th.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span contenteditable="true" data-cat-id="${cat.id}" class="edit-cat-name outline-none hover:bg-indigo-800 px-1 rounded transition w-full" title="Haz clic para editar nombre">${cat.nombre}</span>
            ${!cat.porDefecto ? `<button onclick="eliminarCategoria('${cat.id}')" class="no-print text-indigo-300 hover:text-red-400 p-1" title="Eliminar categoría"><i class="fa-solid xmark fa-trash-can text-xs"></i></button>` : ''}
          </div>
        `;
        tableHeadRow.appendChild(th);
      });

      // Evento para guardar nombre de categoría editado en vivo
      tableHeadRow.querySelectorAll('.edit-cat-name').forEach(span => {
        span.addEventListener('input', () => {
          const id = span.dataset.catId;
          const nuevoNombre = span.innerText.trim();
          const cats = obtenerCategorias();
          const target = cats.find(c => c.id === id);
          if (target) {
            target.nombre = nuevoNombre;
            guardarCategorias(cats);
          }
        });
      });

      // 2. Renderizar Filas de Tabla y Tarjetas Móviles
      tbodyPrivilegios.innerHTML = '';
      containerCards.innerHTML = '';

      fechas.forEach((f) => {
        const idFecha = f.iso;
        const datosFecha = datosGuardados[idFecha] || {};
        const bgCeldaFija = f.esSiguienteMes ? 'bg-amber-100' : 'bg-slate-100';

        // Fila de Tabla
        const tr = document.createElement('tr');
        tr.className = f.esSiguienteMes ? 'bg-amber-50/70 font-medium' : 'hover:bg-slate-50 transition';

        let celdasHtml = `
          <td class="p-3 font-semibold text-slate-700 border-r border-slate-200 sticky-col ${bgCeldaFija} shadow-sm">
            <div class="flex items-center justify-between gap-1">
              <span>${f.formatoTexto}</span>
              ${f.esSiguienteMes ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold">Prox.</span>' : ''}
            </div>
          </td>
        `;

        categorias.forEach(cat => {
          const valorCelda = datosFecha[cat.id] || '';
          celdasHtml += `<td class="p-2 border-r border-slate-200" contenteditable="true" data-fecha="${idFecha}" data-campo="${cat.id}">${valorCelda}</td>`;
        });

        tr.innerHTML = celdasHtml;
        tbodyPrivilegios.appendChild(tr);

        // Tarjetas Móviles
        const card = document.createElement('div');
        card.className = `p-4 rounded-lg border shadow-sm ${f.esSiguienteMes ? 'bg-amber-50/80 border-amber-200' : 'bg-white border-slate-200'}`;
        
        let inputsCardHtml = `
          <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
            <span class="font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-indigo-600"></i> ${f.formatoTexto}
            </span>
            ${f.esSiguienteMes ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded font-bold">Próximo Mes</span>' : ''}
          </div>
          <div class="grid grid-cols-1 gap-2 text-xs">
        `;

        categorias.forEach(cat => {
          const valorCelda = datosFecha[cat.id] || '';
          inputsCardHtml += `
            <div>
              <label class="block text-slate-500 font-semibold mb-1">${cat.nombre}:</label>
              <input type="text" value="${valorCelda}" data-fecha="${idFecha}" data-campo="${cat.id}" class="input-card w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
          `;
        });
        inputsCardHtml += `</div>`;
        card.innerHTML = inputsCardHtml;
        containerCards.appendChild(card);
      });

      escucharCambiosLectura(keyStorage, categorias);
      renderizarNotasMultiples();
    }

    function obtenerFechasEspeciales(year, month) {
      const fechas = [];
      const ultimoDiaMes = new Date(year, month + 1, 0).getDate();
      for (let d = 1; d <= ultimoDiaMes; d++) {
        const dateObj = new Date(year, month, d);
        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 3 || dayOfWeek === 6 || dayOfWeek === 0) {
          fechas.push({
            iso: `${year}-${month + 1}-${d}`,
            formatoTexto: `${diasSemana[dayOfWeek]} ${d}`,
            esSiguienteMes: false
          });
        }
      }

      let nextMonth = month + 1;
      let nextYear = year;
      if (nextMonth > 11) {
        nextMonth = 0;
        nextYear++;
      }

      let d = 1;
      while (true) {
        const dateObj = new Date(nextYear, nextMonth, d);
        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 3 || dayOfWeek === 6 || dayOfWeek === 0) {
          fechas.push({
            iso: `${nextYear}-${nextMonth + 1}-${d}`,
            formatoTexto: `${diasSemana[dayOfWeek]} ${d} (${meses[nextMonth]})`,
            esSiguienteMes: true
          });
          if (dayOfWeek === 0) break;
        }
        d++;
        if (d > 10) break;
      }
      return fechas;
    }

    function escucharCambiosLectura(keyStorage, categorias) {
      const celdas = tbodyPrivilegios.querySelectorAll('[contenteditable="true"]');
      celdas.forEach(celda => {
        celda.addEventListener('input', () => {
          const fecha = celda.dataset.fecha;
          const campo = celda.dataset.campo;
          const valor = celda.innerText.trim();
          guardarDatoPrivilegio(keyStorage, fecha, campo, valor);
          sincronizarInputCard(fecha, campo, valor);
        });
      });

      const inputsCard = containerCards.querySelectorAll('.input-card');
      inputsCard.forEach(input => {
        input.addEventListener('input', () => {
          const fecha = input.dataset.fecha;
          const campo = input.dataset.campo;
          const valor = input.value;
          guardarDatoPrivilegio(keyStorage, fecha, campo, valor);
          sincronizarCeldaTabla(fecha, campo, valor);
        });
      });
    }

    function guardarDatoPrivilegio(keyStorage, fecha, campo, valor) {
      const datos = JSON.parse(localStorage.getItem(keyStorage)) || {};
      if (!datos[fecha]) datos[fecha] = {};
      datos[fecha][campo] = valor;
      localStorage.setItem(keyStorage, JSON.stringify(datos));
    }

    function sincronizarInputCard(fecha, campo, valor) {
      const input = containerCards.querySelector(`[data-fecha="${fecha}"][data-campo="${campo}"]`);
      if (input) input.value = valor;
    }

    function sincronizarCeldaTabla(fecha, campo, valor) {
      const celda = tbodyPrivilegios.querySelector(`[data-fecha="${fecha}"][data-campo="${campo}"]`);
      if (celda) celda.innerText = valor;
    }

    // GESTIÓN DE NOTAS MÚLTIPLES
    function renderizarNotasMultiples() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyNotas = `notas_multi_${year}_${month}`;
      const notas = JSON.parse(localStorage.getItem(keyNotas)) || [];

      listaNotasContainer.innerHTML = '';

      if (notas.length === 0) {
        listaNotasContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-2">No hay notas creadas para este mes.</p>`;
        return;
      }

      notas.forEach((nota, index) => {
        const cardNota = document.createElement('div');
        cardNota.className = 'p-3 bg-slate-50 border border-slate-200 rounded-lg flex items-start justify-between gap-3 shadow-sm';
        cardNota.innerHTML = `
          <div class="space-y-1">
            <h4 class="text-xs font-bold text-indigo-900 uppercase flex items-center gap-1.5">
              <i class="fa-solid fa-bookmark text-amber-500"></i> ${nota.titulo}
            </h4>
            <p class="text-xs text-slate-700 whitespace-pre-wrap">${nota.texto}</p>
          </div>
          <button onclick="eliminarNota(${index})" class="no-print text-slate-400 hover:text-red-600 p-1 transition" title="Eliminar nota">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        listaNotasContainer.appendChild(cardNota);
      });
    }

    function agregarNotaMultiple() {
      const titulo = inputNotaTitulo.value.trim();
      const texto = inputNotaTexto.value.trim();
      if (!titulo || !texto) return;

      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyNotas = `notas_multi_${year}_${month}`;
      const notas = JSON.parse(localStorage.getItem(keyNotas)) || [];

      notas.push({ titulo, texto });
      localStorage.setItem(keyNotas, JSON.stringify(notas));

      inputNotaTitulo.value = '';
      inputNotaTexto.value = '';
      renderizarNotasMultiples();
    }

    function eliminarNota(index) {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyNotas = `notas_multi_${year}_${month}`;
      const notas = JSON.parse(localStorage.getItem(keyNotas)) || [];

      notas.splice(index, 1);
      localStorage.setItem(keyNotas, JSON.stringify(notas));
      renderizarNotasMultiples();
    }

    // COPIAR PARA WHATSAPP
    function copiarParaWhatsApp() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyStorage = `privilegios_${year}_${month}`;
      const keyNotas = `notas_multi_${year}_${month}`;

      const datos = JSON.parse(localStorage.getItem(keyStorage)) || {};
      const notas = JSON.parse(localStorage.getItem(keyNotas)) || [];
      const fechas = obtenerFechasEspeciales(year, month);
      const categorias = obtenerCategorias();

      let mensaje = `*AGENDA DE PRIVILEGIOS - ${meses[month].toUpperCase()} ${year}*\n\n`;

      fechas.forEach(f => {
        const d = datos[f.iso] || {};
        mensaje += `📅 *${f.formatoTexto}*\n`;
        categorias.forEach(cat => {
          if (d[cat.id]) {
            mensaje += `• ${cat.nombre}: ${d[cat.id]}\n`;
          }
        });
        mensaje += `\n`;
      });

      if (notas.length > 0) {
        mensaje += `📌 *NOTAS Y AVISOS:*\n`;
        notas.forEach(n => {
          mensaje += `▪ *${n.titulo}*:\n${n.texto}\n\n`;
        });
      }

      navigator.clipboard.writeText(mensaje).then(() => {
        alert("¡Agenda copiada con éxito! Ya puedes pegarla en tu grupo de WhatsApp.");
      }).catch(err => {
        console.error("Error al copiar: ", err);
      });
    }
  </script>
