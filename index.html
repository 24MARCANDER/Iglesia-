<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Privilegios e Información - Iglesia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #ccc; }
    }
    /* Estilo para celdas y áreas editables */
    [contenteditable="true"]:focus {
      outline: 2px solid #3b82f6;
      background-color: #eff6ff;
      border-radius: 0.25rem;
    }

    /* COLUMNA DE FECHA FIJA (STICKY) AL DESPLAZARSE HORIZONTALMENTE */
    .sticky-col-header {
      position: sticky;
      left: 0;
      z-index: 20;
      background-color: #1e1b4b; /* bg-indigo-950/90 para la cabecera */
    }
    .sticky-col-cell {
      position: sticky;
      left: 0;
      z-index: 10;
      box-shadow: 2px 0 5px -2px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-12">

  <!-- Encabezado / Navbar -->
  <header class="bg-indigo-900 text-white shadow-md no-print sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-church text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Agenda de Privilegios</h1>
          <p class="text-xs text-indigo-200">Programación de Servicios y Notas</p>
        </div>
      </div>
      
      <!-- Controles principales -->
      <div class="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
        <!-- Selector de Mes/Año -->
        <div class="flex items-center bg-indigo-800 rounded-lg p-1 border border-indigo-700">
          <button id="btn-prev" class="px-3 py-1.5 hover:bg-indigo-700 rounded text-indigo-200 hover:text-white transition">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="label-mes-ano" class="px-3 py-1 text-sm font-semibold min-w-[130px] text-center capitalize">
            --
          </span>
          <button id="btn-next" class="px-3 py-1.5 hover:bg-indigo-700 rounded text-indigo-200 hover:text-white transition">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <!-- Botón Exportar WhatsApp -->
        <button id="btn-copy" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-2 transition shadow-sm active:scale-95">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span class="hidden sm:inline">Copiar WhatsApp</span>
        </button>

        <!-- Botón Imprimir -->
        <button onclick="window.print()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-2 transition shadow-sm active:scale-95">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Imprimir / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-2 sm:px-4 mt-4 sm:mt-6 space-y-6">

    <!-- Barra informativa / Vista Móvil -->
    <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-200">
      <div class="text-xs sm:text-sm text-slate-500 flex items-center gap-1.5">
        <i class="fa-solid fa-circle-info text-indigo-600"></i>
        <span>Los cambios se guardan de forma automática.</span>
      </div>
      <!-- Selector de Vista (Solo Visible en Pantallas Pequeñas) -->
      <div class="flex md:hidden bg-slate-100 p-1 rounded-lg border border-slate-200">
        <button id="btn-view-cards" class="px-2.5 py-1 text-xs font-semibold rounded-md transition bg-white text-indigo-900 shadow-sm">
          <i class="fa-solid fa-grip-vertical mr-1"></i>Tarjetas
        </button>
        <button id="btn-view-table" class="px-2.5 py-1 text-xs font-semibold rounded-md transition text-slate-600">
          <i class="fa-solid fa-table mr-1"></i>Tabla
        </button>
      </div>
    </div>

    <!-- SECCIÓN 1: CRONOGRAMA DE PRIVILEGIOS -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <h2 class="font-bold text-slate-800 flex items-center gap-2 text-base sm:text-lg">
          <i class="fa-regular fa-calendar-check text-indigo-600"></i>
          Cronograma del Mes
        </h2>
        <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-full">
          Miércoles, Sábados y Domingos
        </span>
      </div>

      <!-- VISTA EN TABLA (Con primera columna fija) -->
      <div id="container-table" class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[650px]">
          <thead>
            <tr class="bg-indigo-900 text-white text-xs uppercase tracking-wider">
              <th class="p-3 w-48 border-r border-indigo-800 sticky-col-header">Fecha / Día</th>
              <th class="p-3 border-r border-indigo-800">Diaconado</th>
              <th class="p-3 border-r border-indigo-800">Alabanza</th>
              <th class="p-3 border-r border-indigo-800">Prédica</th>
              <th class="p-3">Multimedia</th>
            </tr>
          </thead>
          <tbody id="tbody-privilegios" class="divide-y divide-slate-200 text-sm">
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>

      <!-- VISTA EN TARJETAS (Optimizada para Móviles) -->
      <div id="container-cards" class="hidden md:hidden p-3 space-y-3 bg-slate-50">
        <!-- Tarjetas generadas dinámicamente -->
      </div>
    </section>

    <!-- SECCIÓN 2: APARTADO DE NOTAS / AVISOS EDITABLE -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2 w-full">
          <i class="fa-regular fa-note-sticky text-indigo-600 text-lg"></i>
          <!-- Título Editable -->
          <input 
            type="text" 
            id="titulo-notas" 
            placeholder="Título de la nota (ej: Avisos y Ensayos)..." 
            class="font-bold text-slate-800 text-base sm:text-lg bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full transition px-1"
          >
        </div>
      </div>

      <div class="p-4">
        <!-- Área de Contenido de Notas Editable -->
        <textarea 
          id="contenido-notas" 
          rows="5" 
          placeholder="Escribe aquí las notas, recordatorios o avisos importantes para este mes (ej: Ensayos el viernes a las 7 PM, Limpieza del templo a cargo del diaconado)..." 
          class="w-full p-3 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition resize-y"
        ></textarea>
      </div>
    </section>

  </main>

  <!-- Lógica en JavaScript -->
  <script>
    // Variables globales
    let fechaActual = new Date();
    let modoVista = 'cards';

    // Elementos DOM
    const labelMesAno = document.getElementById('label-mes-ano');
    const tbodyPrivilegios = document.getElementById('tbody-privilegios');
    const containerCards = document.getElementById('container-cards');
    const containerTable = document.getElementById('container-table');
    const tituloNotas = document.getElementById('titulo-notas');
    const contenidoNotas = document.getElementById('contenido-notas');
    const btnCopy = document.getElementById('btn-copy');
    const btnViewCards = document.getElementById('btn-view-cards');
    const btnViewTable = document.getElementById('btn-view-table');

    // Nombres de los meses y días en español
    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
      renderizarTodo();

      document.getElementById('btn-prev').addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() - 1);
        renderizarTodo();
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        fechaActual.setMonth(fechaActual.getMonth() + 1);
        renderizarTodo();
      });

      btnViewCards.addEventListener('click', () => cambiarVistaMovil('cards'));
      btnViewTable.addEventListener('click', () => cambiarVistaMovil('table'));

      // Eventos para guardar Título y Contenido de Notas
      tituloNotas.addEventListener('input', guardarNotas);
      contenidoNotas.addEventListener('input', guardarNotas);

      btnCopy.addEventListener('click', copiarParaWhatsApp);
    });

    // Alternar vista móvil entre tarjetas y tabla
    function cambiarVistaMovil(vista) {
      modoVista = vista;
      if (vista === 'cards') {
        containerCards.classList.remove('hidden');
        containerTable.classList.add('hidden');
        btnViewCards.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewCards.classList.remove('text-slate-600');
        btnViewTable.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewTable.classList.add('text-slate-600');
      } else {
        containerCards.classList.add('hidden');
        containerTable.classList.remove('hidden');
        btnViewTable.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewTable.classList.remove('text-slate-600');
        btnViewCards.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
        btnViewCards.classList.add('text-slate-600');
      }
    }

    // Renderizar Header, Tabla, Tarjetas y Notas
    function renderizarTodo() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();

      // Actualizar cabecera
      labelMesAno.textContent = `${meses[month]} ${year}`;

      // Obtener fechas relevantes (Miércoles, Sábados, Domingos) del mes completo + continuidad hasta el primer Domingo del siguiente
      const fechas = obtenerFechasEspeciales(year, month);

      // Cargar datos previos de la tabla
      const keyStorage = `privilegios_${year}_${month}`;
      const datosGuardados = JSON.parse(localStorage.getItem(keyStorage)) || {};

      // Renderizar Tabla y Tarjetas
      tbodyPrivilegios.innerHTML = '';
      containerCards.innerHTML = '';

      fechas.forEach((f) => {
        const idFecha = f.iso;
        const datos = datosGuardados[idFecha] || { diaconado: '', alabanza: '', predica: '', multimedia: '' };

        // Color de fondo para la celda fija según si es del mes o del siguiente mes
        const bgCeldaFija = f.esSiguienteMes ? 'bg-amber-100' : 'bg-slate-100';

        // 1. Fila de la Tabla (Se añade clase 'sticky-col-cell' a la primera columna)
        const tr = document.createElement('tr');
        tr.className = f.esSiguienteMes ? 'bg-amber-50/70 font-medium' : 'hover:bg-slate-50 transition';

        tr.innerHTML = `
          <td class="p-3 font-semibold text-slate-700 border-r border-slate-200 sticky-col-cell ${bgCeldaFija}">
            <div class="flex items-center justify-between gap-1">
              <span>${f.formatoTexto}</span>
              ${f.esSiguienteMes ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold">Prox. Mes</span>' : ''}
            </div>
          </td>
          <td class="p-2 border-r border-slate-200" contenteditable="true" data-fecha="${idFecha}" data-campo="diaconado">${datos.diaconado}</td>
          <td class="p-2 border-r border-slate-200" contenteditable="true" data-fecha="${idFecha}" data-campo="alabanza">${datos.alabanza}</td>
          <td class="p-2 border-r border-slate-200" contenteditable="true" data-fecha="${idFecha}" data-campo="predica">${datos.predica}</td>
          <td class="p-2" contenteditable="true" data-fecha="${idFecha}" data-campo="multimedia">${datos.multimedia}</td>
        `;
        tbodyPrivilegios.appendChild(tr);

        // 2. Tarjeta para Móvil
        const card = document.createElement('div');
        card.className = `p-4 rounded-lg border shadow-sm ${f.esSiguienteMes ? 'bg-amber-50/80 border-amber-200' : 'bg-white border-slate-200'}`;
        card.innerHTML = `
          <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
            <span class="font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-indigo-600"></i> ${f.formatoTexto}
            </span>
            ${f.esSiguienteMes ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded font-bold">Próximo Mes</span>' : ''}
          </div>
          <div class="grid grid-cols-1 gap-2 text-xs">
            <div>
              <label class="block text-slate-500 font-semibold mb-1">Diaconado:</label>
              <input type="text" value="${datos.diaconado}" data-fecha="${idFecha}" data-campo="diaconado" class="input-card w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-slate-500 font-semibold mb-1">Alabanza:</label>
              <input type="text" value="${datos.alabanza}" data-fecha="${idFecha}" data-campo="alabanza" class="input-card w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-slate-500 font-semibold mb-1">Prédica:</label>
              <input type="text" value="${datos.predica}" data-fecha="${idFecha}" data-campo="predica" class="input-card w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-slate-500 font-semibold mb-1">Multimedia:</label>
              <input type="text" value="${datos.multimedia}" data-fecha="${idFecha}" data-campo="multimedia" class="input-card w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
          </div>
        `;
        containerCards.appendChild(card);
      });

      // Escuchar cambios en la tabla/tarjetas
      escucharCambiosLectura(keyStorage);

      // Cargar Notas guardadas
      cargarNotas();
    }

    // Generar días: Miércoles, Sábados y Domingos de todo el mes + continuidad hasta el primer Domingo del siguiente
    function obtenerFechasEspeciales(year, month) {
      const fechas = [];
      
      // 1. Días del mes actual
      const ultimoDiaMes = new Date(year, month + 1, 0).getDate();
      for (let d = 1; d <= ultimoDiaMes; d++) {
        const dateObj = new Date(year, month, d);
        const dayOfWeek = dateObj.getDay(); // 0: Dom, 3: Mié, 6: Sáb
        
        if (dayOfWeek === 3 || dayOfWeek === 6 || dayOfWeek === 0) {
          fechas.push({
            iso: `${year}-${month + 1}-${d}`,
            formatoTexto: `${diasSemana[dayOfWeek]} ${d}`,
            esSiguienteMes: false
          });
        }
      }

      // 2. Continuidad hacia el mes siguiente hasta encontrar el primer Domingo
      let nextMonth = month + 1;
      let nextYear = year;
      if (nextMonth > 11) {
        nextMonth = 0;
        nextYear++;
      }

      let d = 1;
      while (true) {
        const dateObj = new Date(nextYear, nextMonth, d);
        const dayOfWeek = dateObj.getDay();

        if (dayOfWeek === 3 || dayOfWeek === 6 || dayOfWeek === 0) {
          fechas.push({
            iso: `${nextYear}-${nextMonth + 1}-${d}`,
            formatoTexto: `${diasSemana[dayOfWeek]} ${d} (${meses[nextMonth]})`,
            esSiguienteMes: true
          });

          if (dayOfWeek === 0) {
            break;
          }
        }
        d++;
        if (d > 10) break;
      }

      return fechas;
    }

    // Escuchar cambios para auto-guardar tabla/tarjetas
    function escucharCambiosLectura(keyStorage) {
      const celdas = tbodyPrivilegios.querySelectorAll('[contenteditable="true"]');
      celdas.forEach(celda => {
        celda.addEventListener('input', () => {
          const fecha = celda.dataset.fecha;
          const campo = celda.dataset.campo;
          const valor = celda.innerText.trim();
          
          guardarDatoPrivilegio(keyStorage, fecha, campo, valor);
          sincronizarInputCard(fecha, campo, valor);
        });
      });

      const inputsCard = containerCards.querySelectorAll('.input-card');
      inputsCard.forEach(input => {
        input.addEventListener('input', () => {
          const fecha = input.dataset.fecha;
          const campo = input.dataset.campo;
          const valor = input.value;

          guardarDatoPrivilegio(keyStorage, fecha, campo, valor);
          sincronizarCeldaTabla(fecha, campo, valor);
        });
      });
    }

    function guardarDatoPrivilegio(keyStorage, fecha, campo, valor) {
      const datos = JSON.parse(localStorage.getItem(keyStorage)) || {};
      if (!datos[fecha]) datos[fecha] = {};
      datos[fecha][campo] = valor;
      localStorage.setItem(keyStorage, JSON.stringify(datos));
    }

    function sincronizarInputCard(fecha, campo, valor) {
      const input = containerCards.querySelector(`[data-fecha="${fecha}"][data-campo="${campo}"]`);
      if (input) input.value = valor;
    }

    function sincronizarCeldaTabla(fecha, campo, valor) {
      const celda = tbodyPrivilegios.querySelector(`[data-fecha="${fecha}"][data-campo="${campo}"]`);
      if (celda) celda.innerText = valor;
    }

    // GESTIÓN DE NOTAS (Título + Texto Libre)
    function cargarNotas() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyNotas = `notas_obj_${year}_${month}`;

      const datosNotas = JSON.parse(localStorage.getItem(keyNotas)) || {
        titulo: 'Notas y Avisos Importantes',
        contenido: ''
      };

      tituloNotas.value = datosNotas.titulo;
      contenidoNotas.value = datosNotas.contenido;
    }

    function guardarNotas() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyNotas = `notas_obj_${year}_${month}`;

      const datosNotas = {
        titulo: tituloNotas.value,
        contenido: contenidoNotas.value
      };

      localStorage.setItem(keyNotas, JSON.stringify(datosNotas));
    }

    // COPIAR PARA WHATSAPP
    function copiarParaWhatsApp() {
      const year = fechaActual.getFullYear();
      const month = fechaActual.getMonth();
      const keyStorage = `privilegios_${year}_${month}`;
      const keyNotas = `notas_obj_${year}_${month}`;

      const datos = JSON.parse(localStorage.getItem(keyStorage)) || {};
      const datosNotas = JSON.parse(localStorage.getItem(keyNotas)) || { titulo: 'Notas y Avisos', contenido: '' };
      const fechas = obtenerFechasEspeciales(year, month);

      let mensaje = `*AGENDA DE PRIVILEGIOS - ${meses[month].toUpperCase()} ${year}*\n\n`;

      fechas.forEach(f => {
        const d = datos[f.iso] || {};
        mensaje += `📅 *${f.formatoTexto}*\n`;
        if (d.diaconado) mensaje += `• Diaconado: ${d.diaconado}\n`;
        if (d.alabanza)  mensaje += `• Alabanza: ${d.alabanza}\n`;
        if (d.predica)   mensaje += `• Prédica: ${d.predica}\n`;
        if (d.multimedia)mensaje += `• Multimedia: ${d.multimedia}\n`;
        mensaje += `\n`;
      });

      if (datosNotas.contenido.trim() !== '') {
        mensaje += `📌 *${(datosNotas.titulo || 'NOTAS Y AVISOS').toUpperCase()}:*\n`;
        mensaje += `${datosNotas.contenido.trim()}\n`;
      }

      navigator.clipboard.writeText(mensaje).then(() => {
        alert("¡Agenda copiada con éxito! Ya puedes pegarla en tu grupo de WhatsApp.");
      }).catch(err => {
        console.error("Error al copiar: ", err);
      });
    }
  </script>
</body>
</html>
